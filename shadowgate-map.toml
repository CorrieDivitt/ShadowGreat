# shadowgate-map.toml -- what we know about where things are in Shadowgate (USA).
#
# Addresses, positions and meanings ONLY. Never bytes copied from the ROM.
# Every entry says where it came from; see PROVENANCE.md.
#   verified = true   we tested it ourselves in Mesen or nesrecomp
#   verified = false  from Data Crystal or a guess, not tested yet
# Addresses are NES CPU addresses in hex ($0000-$07FF is RAM).

# SAFETY RULE for our code: only ever write values listed in this file.
# Some bytes are not checked by the game. Example: $0084 = 0x03 on the
# file options screen crashes the game when A is pressed (2026-11-07).

[rom]
name = "Shadowgate (USA)"
mapper = 4            # MMC3
sha1_full = "1af2c83b4724efbfac7fca00fab7f7a8e100caca"
sha1_body = "e7869c683bd93275cde4536cd2ddf37f230dd8d0"   # with the 16-byte header removed

# ------------------------------------------------------------------ RAM

[[ram]]
addr = 0x00AB
name = "cursor_x"
doc = "Cursor X position. Writing it moves the cursor."
source = "Data Crystal RAM map; TASVideos 1651S; tested 2026-11-05"
verified = true

[[ram]]
addr = 0x00AC
name = "cursor_y"
doc = "Cursor Y position. Writing it moves the cursor."
source = "Data Crystal RAM map; TASVideos 1651S; tested 2026-11-05"
verified = true

[[ram]]
addr = 0x0076
name = "cursor_x_work"
doc = "Working copy of cursor X used by the play-screen input loop ($A27C). When the loop starts ($A268) the game copies $AB/$AC into $76/$77; while it runs, moves change $76/$77 and $A636 copies them back to $AB/$AC. So a write to $AB/$AC alone can be overwritten while the loop is running: the mouse code should write both pairs (to test)."
source = "Data Crystal RAM map; write breakpoint on $AB, 2026-11-07; writing both pairs from the mouse works (2026-11-08)"
verified = true

[[ram]]
addr = 0x0077
name = "cursor_y_work"
doc = "Working copy of cursor Y (see cursor_x_work)."
source = "Data Crystal RAM map; write breakpoint on $AB, 2026-11-07; writing both pairs from the mouse works (2026-11-08)"
verified = true

[[ram]]
addr = 0x00AD
name = "cursor_button"
doc = "Which button the cursor is on. Verbs and MOVE use 0x74 + 4 * button number (LOOK 0x74 ... SPEAK 0x90, MOVE 0x94; UP 0xA0, DOWN 0xA4, goods slots 0xA2-0xBA, torches 0xAC/0xB0). In the scene it is set when A is pressed, not while moving: wooden door 0x80, small metal door 0x87, rug 0x9C, empty scenery 0xA3 (first room). Values overlap the button values (LEAVE is also 0x80), so it is probably a position in a table of hotspots, not a unique ID. See [buttons.play]."
source = "Data Crystal RAM map; values recorded with the d-pad 2026-11-06"
verified = true

[[ram]]
addr = 0x00AF
name = "hovered_id"
doc = "ID of the thing under the cursor; changes as the cursor moves over each button, without pressing A. 0x00-0x07 verbs, 0x08 UP, 0x09 DOWN, 0x0A SELF, 0x0B SAVE, 0x0C-0x12 goods slots 1-7, 0x13 MOVE, 0x14/0x15 left/right torch, 0x16 scene entered from the verbs, 0x17 scene entered from MOVE, 0x19 small map (free movement; seen in the input code $A2E8). It also selects the input mode: below 0x16 = buttons, 0x16/0x17 = scene, 0x19 = map."
source = "Data Crystal RAM map; values recorded with the d-pad 2026-11-06"
verified = true

[[ram]]
addr = 0x00B2
name = "selected_command"
doc = "Selected command, set when A is pressed: 0 LOOK, 1 OPEN, 2 USE, 3 LEAVE, 4 TAKE, 5 CLOSE, 6 HIT, 7 SPEAK, 8 MOVE. 0xFF = nothing selected. For verbs it equals hovered_id; MOVE is translated (hovered 0x13 -> command 0x08). Goods slots do not set it: items are used with a verb."
source = "Data Crystal RAM map; values recorded with the d-pad 2026-11-06"
verified = true

[[ram]]
addr = 0x00B5
name = "inventory_page"
doc = "Seen 0x08 after UP (goods) and 0x09 after DOWN (spells), with fewer than 7 goods. Slot IDs are the same on both pages. Reported: with more goods the game adds more cards (pages) that UP/DOWN scroll through, so this may be the last arrow pressed rather than the page; to check with more than 7 goods."
source = "Recorded with the d-pad 2026-11-06"
verified = true

[[ram]]
addr = 0x00E5
name = "screen_id"
doc = "Which screen is showing; see [screens]. 0x10 title, 0x11 file select and file options, 0x65 play, 0x6C play with a message box, 0x12 game over, 0x13 save confirm."
source = "Data Crystal RAM map (its values were partly wrong); every screen checked in Mesen 2026-11-07; logged frame by frame by our own build 2026-11-08"
# Between screens $E5 passes through other values for 1-35 frames (seen 2026-11-08):
# 0x00, 0x14, 0xF0 at power-on/reset; 0x17, 0x58, 0x60, 0x61, 0x62, 0x63, 0x66, 0x67, 0x69, 0x6B, 0x6D
# around play/message changes. 0x14 holds for about 220 frames before the title screen.
# Code must treat any value not in [screens] as "busy" and do nothing.
verified = true

[[ram]]
addr = 0x0035
name = "event_random"
doc = "Reported: decides the Sphinx's riddle and the number of lightning strikes in the final fight; changes a few frames after the event starts. The game's randomness runs on a global timer."
source = "TASVideos 1651S and 3185S notes"
verified = false

