[text.packed]
# How the game stores text in the ROM (worked out 2026-11-06, checked by
# decoding real strings). A continuous bit stream read highest bit first,
# 5 bits per code. Codes 0x00-0x19 are A-Z. The game turns codes into tiles
# with its own table at $C7AD, which our code reads from the player's ROM.
bits_per_code = 5
bit_order = "msb_first"
letters = [0x00, 0x19]    # A = 0x00 ... Z = 0x19
space = 0x1A
shift = 0x1E              # the next code + 0x20 is printed instead
end = 0x1F
# Messages and words use the same 5-bit codes. A message can insert words,
# which are stored one per 8-byte slot in two lists while ROM bank 4 is
# swapped in: word n of list A is at $B000 + 8n, of list B at $B800 + 8n
# (CPU addresses). Example: list B word 6 is the "THIS " that starts the
# wooden door message.
escape = 0x1E             # in a message: the next code selects a word insert
word_list_a = 0xB000
word_list_b = 0xB800
word_slot_bytes = 8
word_bank = 4            # in 16 KB units: 8 KB banks 8-9 at $8000-$BFFF, lists in bank 9 (checked 2026-11-08 by decoding the bellows message offline)
new_line = 0x1D           # in a message
# In a message, escape + a code below 0x1C prints character (code + 0x20):
# escape + 0x00 is the full stop. Confirmed by decoding the wooden door
# message from the user's ROM: [list B word 6] WOODEN DOOR IS / REINFORCED
# WITH HEAVY / SHEETS OF STEEL. then 0x1B, then end.
# Escape + 0x1E (read from the game's code at $C541, 2026-11-08): skip to the
# next whole byte, read a 2-byte RAM address (low byte first), and print word
# number RAM[address] from list A. Used for "THE <thing> IS OPEN." ($0514 seen).
# Message code 0x1B ($C63D) ends a page: the game waits for A. 0x1C ($C650)
# after it clears the box for a new paragraph (matches the blank lines in the
# script for the 11-page opening message, decoded in full 2026-11-08).
# Escape + 0x1F ($C627) prints a number from $8B-$8D (not seen yet).

[text.layout]
# Worked out 2026-11-06 by matching a buffer snapshot to the message on screen.
# Each text line takes 0x34 (52) bytes: 26 upper-row tiles, then 26 letters.
# Upper-row tiles are 0xDF (blank) for normal letters.
lines = 4
columns = 26
line_stride = 0x34
first_letter = 0x064A     # line n's letters start at first_letter + n * line_stride
blank_tile = 0xDF         # unprinted position / upper row
pad = 0x7F                # space; the rest of a line is padded with it after printing

# ------------------------------------------------------------------ screens
# Checked 2026-11-07 by visiting every screen in Mesen. cursor = whether
# $AB/$AC move on that screen. Choices are what the player can pick.
# Menus only take A to confirm: Start does not proceed and B does not go back.
# Not yet tested (user's choice, 2026-11-07; check during Phase 6 testing):
# writing $84 and $75 with valid values. ($1C staying steady: confirmed 2026-11-08.)

[screens.title]
id = 0x10
cursor = false
choices = []              # waits for Start

[screens.file_select]
id = 0x11
cursor = false
choices = ["FILE 1", "FILE 2", "FILE 3"]
choice_byte = 0x00E7      # verified: write the choice, then press A
confirm = "A"
variant_byte = 0x001C
variant_value = 0xB2

[screens.file_options]
id = 0x11                 # same id as file_select; told apart by $001C
cursor = false
choices = ["CONTINUE", "EXIT", "NEW GAME"]
choice_byte = 0x0084      # candidate, not yet write-tested with a valid value
confirm = "A"
variant_byte = 0x001C
variant_value = 0xAD

[screens.play]
id = 0x65
cursor = true
choices = "see [buttons.play], plus the scene and the small map"

[screens.message]
id = 0x6C
cursor = false
choices = []              # A closes or advances the message

[screens.game_over]
id = 0x12
cursor = false
choices = ["CONTINUE", "END"]
choice_byte = 0x0075      # candidate, not yet write-tested
confirm = "A"

[screens.save_confirm]
id = 0x13
cursor = false
choices = ["YES", "NO"]
choice_byte = 0x0075      # candidate, not yet write-tested
confirm = "A"

# ------------------------------------------------------------------ cursor to screen
# Measured 2026-11-07 in Mesen with overscan off (full 256 x 240 picture),
# at three cursor positions (0x40,0x40), (0x60,0x70), (0x20,0x30).
# The fingertip of the cursor is exactly at screen pixel ($AB, $AC): one
# cursor step is one pixel and there is no offset. The hand picture's
# top-left corner is at ($AB - 3, $AC). So screen pixels and cursor values
# are the same numbers, and hit boxes can be written in either.

[cursor]
screen_width = 256
screen_height = 240
scale = 1
offset_x = 0              # pixel x = $AB + offset_x
offset_y = 0              # pixel y = $AC + offset_y
sprite_left_of_tip = 3    # the hand picture starts 3 pixels left of the tip

# ------------------------------------------------------------------ cursor snap points
# Cursor values ($AB, $AC) the game uses for each list item. Measured 2026-11-05.
# Hit boxes (whole-word rectangles in screen pixels) get added beside these later.

[snap]
scene_bounds = [0x0F, 0x20, 0x7F, 0x90]   # left, top, right, bottom: free movement inside

[snap.play]
MOVE       = [0x23, 0xA4]
LOOK       = [0x63, 0xAC]
OPEN       = [0x63, 0xBC]
USE        = [0x63, 0xCC]
LEAVE      = [0x63, 0xDC]
TAKE       = [0x93, 0xAC]
CLOSE      = [0x93, 0xBC]
HIT        = [0x93, 0xCC]
SPEAK      = [0x93, 0xDC]
CARD_UP    = [0xC3, 0xAC]
CARD_DOWN  = [0xC3, 0xBC]
SELF       = [0xC3, 0xCC]
SAVE       = [0xC3, 0xDC]
GOODS_1    = [0x9B, 0x2C]
GOODS_2    = [0x9B, 0x3C]
GOODS_3    = [0x9B, 0x4C]
GOODS_4    = [0x9B, 0x5C]
GOODS_5    = [0x9B, 0x6C]
GOODS_6    = [0x9B, 0x7C]
GOODS_7    = [0x9B, 0x8C]

# ------------------------------------------------------------------ buttons
# Everything the game sets when the cursor is on a button, recorded with the
# d-pad on 2026-11-06. snap = ($AB, $AC); ad = $AD; af = $AF while hovering;
# command = $B2 after pressing A (verbs and MOVE only).
# SELF and SAVE: no $AD value recorded; writing X/Y alone was enough in the snapping test.

[buttons.play]
LOOK  = { snap = [0x63, 0xAC], ad = 0x74, af = 0x00, command = 0x00 }
OPEN  = { snap = [0x63, 0xBC], ad = 0x78, af = 0x01, command = 0x01 }
USE   = { snap = [0x63, 0xCC], ad = 0x7C, af = 0x02, command = 0x02 }
LEAVE = { snap = [0x63, 0xDC], ad = 0x80, af = 0x03, command = 0x03 }
TAKE  = { snap = [0x93, 0xAC], ad = 0x84, af = 0x04, command = 0x04 }
CLOSE = { snap = [0x93, 0xBC], ad = 0x88, af = 0x05, command = 0x05 }
HIT   = { snap = [0x93, 0xCC], ad = 0x8C, af = 0x06, command = 0x06 }
SPEAK = { snap = [0x93, 0xDC], ad = 0x90, af = 0x07, command = 0x07 }
MOVE  = { snap = [0x23, 0xA4], ad = 0x94, af = 0x13, command = 0x08 }
UP      = { snap = [0xC3, 0xAC], ad = 0xA0, af = 0x08 }   # shows the goods page
DOWN    = { snap = [0xC3, 0xBC], ad = 0xA4, af = 0x09 }   # shows the spell page
SELF    = { snap = [0xC3, 0xCC], af = 0x0A }
SAVE    = { snap = [0xC3, 0xDC], af = 0x0B }
SLOT_1  = { snap = [0x9B, 0x2C], ad = 0xA2, af = 0x0C }
SLOT_2  = { snap = [0x9B, 0x3C], ad = 0xA6, af = 0x0D }
SLOT_3  = { snap = [0x9B, 0x4C], ad = 0xAA, af = 0x0E }
SLOT_4  = { snap = [0x9B, 0x5C], ad = 0xAE, af = 0x0F }
SLOT_5  = { snap = [0x9B, 0x6C], ad = 0xB2, af = 0x10 }
SLOT_6  = { snap = [0x9B, 0x7C], ad = 0xB6, af = 0x11 }
SLOT_7  = { snap = [0x9B, 0x8C], ad = 0xBA, af = 0x12 }
TORCH_L = { snap = [0x93, 0x1C], ad = 0xAC, af = 0x14 }
TORCH_R = { snap = [0xEB, 0x1C], ad = 0xB0, af = 0x15 }

[buttons.scene]
# The scene is free movement: when A is pressed the game works out which
# object is under the cursor itself and stores the result in $AD. $AF depends on where the cursor came from.
af_from_verbs = 0x16
af_from_move = 0x17
# Tested 2026-11-06: with LOOK selected and the cursor still on LOOK, writing
# only $AB/$AC onto an object and pressing A works. The game sets $AD itself
# and $AF does not need changing. First room: wooden door at (0x47, 0x70)
# -> $AD 0x80, rug at (0x47, 0x88), plain wall at (0x47, 0x2C) -> 0xA3.
click_needs = ["cursor_x", "cursor_y", "press A"]
# The small map under MOVE also lets the cursor move freely, and exit squares
# sit in different places per room. Treated like the scene (write X/Y, press
# A; the game decides). Judged from watching it in Mesen, 2026-11-07, not a
# write test; revisit if map clicks misbehave. The input code ($A2E8) shows
# the map is its own mode with $AF = 0x19, so a map click will probably need
# $AF = 0x19 written as well as X/Y (check in Phase 6 testing).
# CONFIRMED 2026-11-08 by the user: map clicks with X/Y only did nothing
# until the d-pad had entered the map once (which sets $AF = 0x19); after that
# they worked. So a map click writes X/Y AND $AF = 0x19. A scene click made
# while $AF = 0x19 sets $AF back to 0x16 (0x17 when $B2 = MOVE) - to test.
map_af = 0x19

# ------------------------------------------------------------------ hand cursor
# The game's hand, recorded by the user in Mesen's sprite viewer 2026-11-08
# (hand on LOOK: OAM X 0x5E, Y 0xAB for cursor $AB/$AC = 0x63/0xAC).
# CMakeLists.txt reads these 4 tiles from the player's ROM into the build
# folder so feat_hand.c can draw the hand as the mouse pointer everywhere.

[hand_cursor]
oam_slots = [1, 2, 3, 4]       # on the play screen
tiles = [0x7A, 0x7B, 0x7C, 0x7D]  # 8 x 8 each, laid out 7A 7B / 7C 7D (16 x 16), no flips
chr_offset = 0x17A0            # tile 0x7A inside CHR-ROM; the 4 tiles are 64 bytes in a row
palette = 2                    # sprite palette 2
colors = [0x0F, 0x0F, 0x30, 0x30]  # pixel values 0-3 (0 = see-through); Mesen showed 0x26 last, but the hand is white on screen (user, 2026-11-08)
tip = [5, 0]                   # fingertip inside the 16 x 16 picture = cursor ($AB, $AC)
# Correction: the hand picture starts 5 pixels left of the fingertip, not 3
# as estimated in [cursor] (checked by drawing the tiles from the ROM).

