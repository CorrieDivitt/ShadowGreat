# shadowgate-map.toml -- what we know about where things are in Shadowgate (USA).
#
# Addresses, positions and meanings ONLY. Never bytes copied from the ROM.
# Every entry says where it came from; see PROVENANCE.md.
#   verified = true   we tested it ourselves in Mesen or nesrecomp
#   verified = false  from Data Crystal or a guess, not tested yet
# Addresses are NES CPU addresses in hex ($0000-$07FF is RAM).

[rom]
name = "Shadowgate (USA)"
mapper = 4            # MMC3
sha1_full = "1af2c83b4724efbfac7fca00fab7f7a8e100caca"
sha1_body = "e7869c683bd93275cde4536cd2ddf37f230dd8d0"   # with the 16-byte header removed

# ------------------------------------------------------------------ RAM

[[ram]]
addr = 0x00AB
name = "cursor_x"
doc = "Cursor X position. Writing it moves the cursor."
source = "Data Crystal RAM map; TASVideos 1651S; tested 2026-11-05"
verified = true

[[ram]]
addr = 0x00AC
name = "cursor_y"
doc = "Cursor Y position. Writing it moves the cursor."
source = "Data Crystal RAM map; TASVideos 1651S; tested 2026-11-05"
verified = true

[[ram]]
addr = 0x0076
name = "cursor_x_copy"
doc = "Copy of cursor X."
source = "Data Crystal RAM map"
verified = false

[[ram]]
addr = 0x0077
name = "cursor_y_copy"
doc = "Copy of cursor Y."
source = "Data Crystal RAM map"
verified = false

[[ram]]
addr = 0x00AD
name = "cursor_button"
doc = "Which button the cursor is on. Verbs and MOVE use 0x74 + 4 * button number (LOOK 0x74 ... SPEAK 0x90, MOVE 0x94; UP 0xA0, DOWN 0xA4, goods slots 0xA2-0xBA, torches 0xAC/0xB0). In the scene it is set when A is pressed, not while moving: wooden door 0x80, small metal door 0x87, rug 0x9C, empty scenery 0xA3 (first room). Values overlap the button values (LEAVE is also 0x80), so it is probably a position in a table of hotspots, not a unique ID. See [buttons.play]."
source = "Data Crystal RAM map; values recorded with the d-pad 2026-11-06"
verified = true

[[ram]]
addr = 0x00AF
name = "hovered_id"
doc = "ID of the thing under the cursor; changes as the cursor moves over each button, without pressing A. 0x00-0x07 verbs, 0x08 UP, 0x09 DOWN, 0x0A SELF, 0x0B SAVE, 0x0C-0x12 goods slots 1-7, 0x13 MOVE, 0x14/0x15 left/right torch, 0x16 scene entered from the verbs, 0x17 scene entered from MOVE."
source = "Data Crystal RAM map; values recorded with the d-pad 2026-11-06"
verified = true

[[ram]]
addr = 0x00B2
name = "selected_command"
doc = "Selected command, set when A is pressed: 0 LOOK, 1 OPEN, 2 USE, 3 LEAVE, 4 TAKE, 5 CLOSE, 6 HIT, 7 SPEAK, 8 MOVE. 0xFF = nothing selected. For verbs it equals hovered_id; MOVE is translated (hovered 0x13 -> command 0x08). Goods slots do not set it: items are used with a verb."
source = "Data Crystal RAM map; values recorded with the d-pad 2026-11-06"
verified = true

[[ram]]
addr = 0x00B5
name = "inventory_page"
doc = "Which list the inventory shows: 0x08 goods (set by UP), 0x09 spells (set by DOWN). Slot IDs are the same on both pages."
source = "Recorded with the d-pad 2026-11-06"
verified = true

[[ram]]
addr = 0x00E5
name = "screen_id"
doc = "Which screen is showing. Known: 0x12 title, 0x11 load, 0x13 save."
source = "Data Crystal RAM map"
verified = false

[[ram]]
addr = 0x0035
name = "event_random"
doc = "Reported: decides the Sphinx's riddle and the number of lightning strikes in the final fight; changes a few frames after the event starts. The game's randomness runs on a global timer."
source = "TASVideos 1651S and 3185S notes"
verified = false

[[ram]]
addr = 0x0496
size = 0x45
name = "inventory"
doc = "Reported: item IDs, one byte per item, from $0496 up to $04DA. Normal items are 0x00-0x67. Possibly the same numbers as word list A (item names); to check."
source = "TASVideos 3185S and 3248S notes"
verified = false

[[ram]]
addr = 0x04DE
name = "state_04de"
doc = "Reported: game-state byte changed by particular stones, the sphere in the lake and key 3 (used by the glasses trick)."
source = "TASVideos 3185S notes"
verified = false

[[ram]]
addr = 0x04ED
name = "talisman_placed"
doc = "Reported: 1 when the talisman (or the crest) has been placed in its slot."
source = "TASVideos 3248S notes"
verified = false

[[ram]]
addr = 0x00F0
name = "text_wait_state"
doc = "Reported: normally 1, becomes 3 on the first frame that pressing A will close the text box. Candidate 'waiting for A' signal."
source = "TASVideos submission 1651S notes (https://tasvideos.org/1651S); not yet tested"
verified = false

[[ram]]
addr = 0x00F5
name = "text_starting_flag"
doc = "Reported: normally 128 (0x80), becomes 0 on the frame before a text box appears, then returns to 128. Note: Data Crystal lists $F5 as player 1 controller bits, so this needs checking."
source = "TASVideos submission 1651S notes (https://tasvideos.org/1651S); conflicts with Data Crystal; not yet tested"
verified = false

[[ram]]
addr = 0x04F4
name = "torch_left_charges"
doc = "Reported: how much the left torch has left (a new torch has 60). Only some rooms drain it."
source = "TASVideos submission 1651S notes (https://tasvideos.org/1651S); not yet tested"
verified = false

[[ram]]
addr = 0x04F7
name = "torch_right_charges"
doc = "Reported: how much the right torch has left."
source = "TASVideos submission 1651S notes (https://tasvideos.org/1651S); not yet tested"
verified = false

[[ram]]
addr = 0x0500
name = "current_room"
source = "Data Crystal RAM map"
verified = false

[[ram]]
addr = 0x0512
name = "previous_room"
source = "Data Crystal RAM map"
verified = false

[[ram]]
addr = 0x0630
size = 0xD0
name = "text_buffer"
doc = "Text buffer ($0630-$06FF). Holds the message box as 4 lines; see [text.layout]."
source = "Data Crystal RAM map; layout worked out from a buffer snapshot on 2026-11-06"
verified = true

[[ram]]
addr = 0x0624
name = "text_column"
doc = "Position within the current line while a message prints. Reset to 0 when a message starts."
source = "Observed with a write breakpoint, 2026-11-06"
verified = false

[[ram]]
addr = 0x0625
name = "text_line"
doc = "Current line (0-3) while a message prints. Reset to 0 when a message starts."
source = "Observed with a write breakpoint, 2026-11-06"
verified = false

[[ram]]
addr = 0x0092
name = "text_box_ready"
doc = "Flag checked when a message starts; set to 0xFF after the text box is first prepared."
source = "Observed with a write breakpoint, 2026-11-06"
verified = false

[[ram]]
addr = 0x0622
name = "text_char_code"
doc = "Code of the letter being printed, before translation to a tile (seen 0x07 for H, so codes look alphabetical from A = 0)."
source = "Observed with a write breakpoint on $0628, 2026-11-06"
verified = false

[[ram]]
addr = 0x0628
name = "text_char_tile"
doc = "Tile of the letter being printed (text table value). Copied into the text buffer and sent to the screen with $0626-$0627."
source = "Observed with write breakpoints, 2026-11-06"
verified = true

[[ram]]
addr = 0x062E
name = "text_line_width"
doc = "Number of columns the message-start clear loop covers (expected 26)."
source = "Observed in the message-start clear loop, 2026-11-06"
verified = false

[[ram]]
addr = 0x0090
name = "text_fast"
doc = "When non-zero, the pause between letters is skipped. Probably set while A is held."
source = "Observed in the per-letter step, 2026-11-06"
verified = false

[[ram]]
addr = 0x0000
size = 2
name = "message_read_pointer"
doc = "Address of the next byte of the message being printed, low byte first (the outer stream; words are read separately via $0087). Points at the start of the message when $C49E begins."
source = "Read in the message loop at $C49E; a whole message decoded from it, 2026-11-06"
verified = true

[[ram]]
addr = 0x00EB
name = "message_bit_count"
doc = "Bits already used from the current message byte. Reset to 0 when a message starts."
source = "Message loop at $C49E; consistent with a full decode, 2026-11-06"
verified = true

[[ram]]
addr = 0x00EC
name = "message_bit_buffer"
doc = "The message byte being read, shifted one bit per read (expected from the snapshot; not yet seen in code)."
source = "Memory snapshot at a word insert, 2026-11-06"
verified = false

[[ram]]
addr = 0x00ED
name = "message_byte_build"
doc = "Where an 8-bit value inside a message (a word number) is assembled."
source = "Read in $C448, 2026-11-06"
verified = true

[[ram]]
addr = 0x0087
size = 2
name = "text_read_pointer"
doc = "Address of the next packed text byte to read, low byte first. Advanced by one after each byte is loaded."
source = "Read in the one-bit reader at $C5FE; decoded real text from it, 2026-11-06"
verified = true

[[ram]]
addr = 0x00EE
name = "text_bit_count"
doc = "Bits already used from the current packed byte (0-7). 0 means load a new byte."
source = "Read in the one-bit reader at $C5FE, 2026-11-06"
verified = true

[[ram]]
addr = 0x00EF
name = "text_bit_buffer"
doc = "The packed byte being read; shifted left one bit per read."
source = "Read in the one-bit reader at $C5FE, 2026-11-06"
verified = true

[[ram]]
addr = 0x04FE
name = "text_code_build"
doc = "Where each 5-bit code is assembled, one bit at a time."
source = "Read in the code reader at $C5E4, 2026-11-06"
verified = true

[[ram]]
addr = 0x0058
size = 2
name = "unknown_pointer_58"
doc = "Changes while text prints (moved 8 bytes per letter). Not the text pointer; possibly graphics or music."
source = "Memory snapshots during a message, 2026-11-06"
verified = false

# Code locations (addresses only):
#   $C721  a new message starts: fills the 4 lines with 0xDF (upper rows) and
#          0x7F (letter rows), $062E columns wide
#   $C760  letter lookup: translates the code in $0622 into a tile via the
#          ROM table at $C7AD and stores it in $0628
#   $C82A  per-letter step: sends $0626-$0628 to the screen (via $EEEE), waits
#          4 short steps ($CA37) unless $0090 is set, then writes 0xDF/upper
#          row and the tile into the text buffer
#   $C49E  print a message: reads 5-bit codes from the message stream until
#          0x1F; control codes 0x1D = new line ($C64C), 0x1B (seen just before
#          the end; handled at $C63D) and 0x1C ($C650) not yet known; 0x1E is an escape whose next code is
#          handled by $C517; anything else is a letter, printed via $C760
#   $C517  escape handler: 0x1C = word from list A, 0x1D = word from list B
#          (both with an 8-bit word number from the message), 0x1E = word from
#          list A whose number is in RAM at a 2-byte address in the message,
#          0x1F -> $C627 (not yet known)
#   $C430  read one 5-bit code from the message stream
#   $C448  read one 8-bit value from the message stream (8 calls to $C460) into $00ED
#   $A277  (bank not known) patched by the TCRF message-debug Game Genie codes
#          SINZYXGY + KZNXAZXZ, which turn the controls into a message viewer
#          (message index 00-FF, library 0-2). Decoded: the call target there
#          changes from $A27C to $A4D5, so $A4D5 is probably the debug viewer.
#          Unverified deduction; a lead for finding the message-number table.
#   $EAD9  swap in a ROM bank (A = 4 before reading the word lists); $EAF3 swaps back
#   $C5BC  print one packed string: reads 5-bit codes until 0x1F; 0x1E means
#          "next code + 0x20"; each code is printed via $C760
#   $C5E4  read one 5-bit code (calls $C5FE five times) into $04FE
#   $C5FE  read one bit from the packed text at $0087/$0088
#   $C3F1  ROM table of where each line starts in the buffer
#   $C7AD  ROM table: letter code -> tile

# Candidates still to confirm with breakpoints (Phase 4):
#   $EB/$EC change in step with text printing ($58/$59 now listed above)
#   $ED, $EE/$EF also change while printing

# ------------------------------------------------------------------ text table
# How letters are encoded. Byte value -> character.

[text]
end_marker = "none seen"   # messages end with . (A1) and the line is padded with spaces
source = "Data Crystal text table; A1 found 2026-11-05"

[text.chars]
0x7F = " "
0x80 = "0"
0x81 = "1"
0x82 = "2"
0x83 = "3"
0x84 = "4"
0x85 = "5"
0x86 = "6"
0x87 = "7"
0x88 = "8"
0x89 = "9"
0x8A = "!"
0xA1 = "."
0xB1 = "A"
0xB2 = "B"
0xB3 = "C"
0xB4 = "D"
0xB5 = "E"
0xB6 = "F"
0xB7 = "G"
0xB8 = "H"
0xB9 = "I"
0xBA = "J"
0xBB = "K"
0xBC = "L"
0xBD = "M"
0xBE = "N"
0xBF = "O"
0xC0 = "P"
0xC1 = "Q"
0xC2 = "R"
0xC3 = "S"
0xC4 = "T"
0xC5 = "U"
0xC6 = "V"
0xC7 = "W"
0xC8 = "X"
0xC9 = "Y"
0xCA = "Z"

[text.packed]
# How the game stores text in the ROM (worked out 2026-11-06, checked by
# decoding real strings). A continuous bit stream read highest bit first,
# 5 bits per code. Codes 0x00-0x19 are A-Z. The game turns codes into tiles
# with its own table at $C7AD, which our code reads from the player's ROM.
bits_per_code = 5
bit_order = "msb_first"
letters = [0x00, 0x19]    # A = 0x00 ... Z = 0x19
space = 0x1A
shift = 0x1E              # the next code + 0x20 is printed instead
end = 0x1F
# Messages and words use the same 5-bit codes. A message can insert words,
# which are stored one per 8-byte slot in two lists while ROM bank 4 is
# swapped in: word n of list A is at $B000 + 8n, of list B at $B800 + 8n
# (CPU addresses). Example: list B word 6 is the "THIS " that starts the
# wooden door message.
escape = 0x1E             # in a message: the next code selects a word insert
word_list_a = 0xB000
word_list_b = 0xB800
word_slot_bytes = 8
word_bank = 4
new_line = 0x1D           # in a message
# In a message, escape + a code below 0x1C prints character (code + 0x20):
# escape + 0x00 is the full stop. Confirmed by decoding the wooden door
# message from the user's ROM: [list B word 6] WOODEN DOOR IS / REINFORCED
# WITH HEAVY / SHEETS OF STEEL. then 0x1B, then end.

[text.layout]
# Worked out 2026-11-06 by matching a buffer snapshot to the message on screen.
# Each text line takes 0x34 (52) bytes: 26 upper-row tiles, then 26 letters.
# Upper-row tiles are 0xDF (blank) for normal letters.
lines = 4
columns = 26
line_stride = 0x34
first_letter = 0x064A     # line n's letters start at first_letter + n * line_stride
blank_tile = 0xDF         # unprinted position / upper row
pad = 0x7F                # space; the rest of a line is padded with it after printing

# ------------------------------------------------------------------ cursor snap points
# Cursor values ($AB, $AC) the game uses for each list item. Measured 2026-11-05.
# Hit boxes (whole-word rectangles in screen pixels) get added beside these later.

[snap]
scene_bounds = [0x0F, 0x20, 0x7F, 0x90]   # left, top, right, bottom: free movement inside

[snap.play]
MOVE       = [0x23, 0xA4]
LOOK       = [0x63, 0xAC]
OPEN       = [0x63, 0xBC]
USE        = [0x63, 0xCC]
LEAVE      = [0x63, 0xDC]
TAKE       = [0x93, 0xAC]
CLOSE      = [0x93, 0xBC]
HIT        = [0x93, 0xCC]
SPEAK      = [0x93, 0xDC]
CARD_UP    = [0xC3, 0xAC]
CARD_DOWN  = [0xC3, 0xBC]
SELF       = [0xC3, 0xCC]
SAVE       = [0xC3, 0xDC]
GOODS_1    = [0x9B, 0x2C]
GOODS_2    = [0x9B, 0x3C]
GOODS_3    = [0x9B, 0x4C]
GOODS_4    = [0x9B, 0x5C]
GOODS_5    = [0x9B, 0x6C]
GOODS_6    = [0x9B, 0x7C]
GOODS_7    = [0x9B, 0x8C]

# ------------------------------------------------------------------ buttons
# Everything the game sets when the cursor is on a button, recorded with the
# d-pad on 2026-11-06. snap = ($AB, $AC); ad = $AD; af = $AF while hovering;
# command = $B2 after pressing A (verbs and MOVE only).
# SELF and SAVE: no $AD value recorded; writing X/Y alone was enough in the snapping test.

[buttons.play]
LOOK  = { snap = [0x63, 0xAC], ad = 0x74, af = 0x00, command = 0x00 }
OPEN  = { snap = [0x63, 0xBC], ad = 0x78, af = 0x01, command = 0x01 }
USE   = { snap = [0x63, 0xCC], ad = 0x7C, af = 0x02, command = 0x02 }
LEAVE = { snap = [0x63, 0xDC], ad = 0x80, af = 0x03, command = 0x03 }
TAKE  = { snap = [0x93, 0xAC], ad = 0x84, af = 0x04, command = 0x04 }
CLOSE = { snap = [0x93, 0xBC], ad = 0x88, af = 0x05, command = 0x05 }
HIT   = { snap = [0x93, 0xCC], ad = 0x8C, af = 0x06, command = 0x06 }
SPEAK = { snap = [0x93, 0xDC], ad = 0x90, af = 0x07, command = 0x07 }
MOVE  = { snap = [0x23, 0xA4], ad = 0x94, af = 0x13, command = 0x08 }
UP      = { snap = [0xC3, 0xAC], ad = 0xA0, af = 0x08 }   # shows the goods page
DOWN    = { snap = [0xC3, 0xBC], ad = 0xA4, af = 0x09 }   # shows the spell page
SELF    = { snap = [0xC3, 0xCC], af = 0x0A }
SAVE    = { snap = [0xC3, 0xDC], af = 0x0B }
SLOT_1  = { snap = [0x9B, 0x2C], ad = 0xA2, af = 0x0C }
SLOT_2  = { snap = [0x9B, 0x3C], ad = 0xA6, af = 0x0D }
SLOT_3  = { snap = [0x9B, 0x4C], ad = 0xAA, af = 0x0E }
SLOT_4  = { snap = [0x9B, 0x5C], ad = 0xAE, af = 0x0F }
SLOT_5  = { snap = [0x9B, 0x6C], ad = 0xB2, af = 0x10 }
SLOT_6  = { snap = [0x9B, 0x7C], ad = 0xB6, af = 0x11 }
SLOT_7  = { snap = [0x9B, 0x8C], ad = 0xBA, af = 0x12 }
TORCH_L = { snap = [0x93, 0x1C], ad = 0xAC, af = 0x14 }
TORCH_R = { snap = [0xEB, 0x1C], ad = 0xB0, af = 0x15 }

[buttons.scene]
# The scene is free movement: when A is pressed the game works out which
# object is under the cursor itself, from a per-room table we have not found
# yet, and stores the result in $AD. $AF depends on where the cursor came from.
af_from_verbs = 0x16
af_from_move = 0x17
